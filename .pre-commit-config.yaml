repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    # default_language_version: python3.14
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML
        args: [--unsafe]
      - id: check-toml
        name: Check TOML
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: check-case-conflict
        name: Check for case conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # Ruff - Fast Python linter (already in dev deps)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        name: Ruff linter
        args: [--fix]
      - id: ruff-format
        name: Ruff formatter
        args: [--line-length=100]

  # Type checks pyright
  - repo: local
    hooks:
      - id: pyright
        name: Pyright type checker
        entry: uv run pyright
        language: system
        types: [python]
        files: ^src/
        pass_filenames: true

default_language_version:
  python: python3.14

# Run hooks on these files by default
files: ^(src/|tests/|notebooks/|pyproject.toml)
exclude: ^(old/|\.git|__pycache__|\.eggs)

# Fail if any hook fails (set to false for warnings only)
fail_fast: false

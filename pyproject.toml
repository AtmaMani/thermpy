[project]
name = "thermpy"
version = "0.1.0"
description = "Python library for converting radiant temperatures to kinetic temperatures using Planck's laws."
readme = "README.md"
authors = [{ name = "Atma Mani", email = "atma.mani42@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
]

[project.scripts]
thermpy = "thermpy:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

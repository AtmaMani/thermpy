<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="#0F172A"/>

  <!-- radiance waves -->
  <g fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round">
    <path d="M150 170 Q110 256 150 342"/>
    <path d="M112 140 Q50 256 112 372" opacity="0.55"/>
    <path d="M362 170 Q402 256 362 342"/>
    <path d="M400 140 Q462 256 400 372" opacity="0.55"/>
  </g>

  <!-- thermometer tube -->
  <rect x="226" y="100" width="60" height="256" rx="30" fill="#E2E8F0"/>

  <!-- mercury column -->
  <rect x="246" y="200" width="20" height="170" rx="10" fill="url(#heat)"/>

  <!-- bulb -->
  <circle cx="256" cy="352" r="58" fill="url(#heat)"/>
</svg>
